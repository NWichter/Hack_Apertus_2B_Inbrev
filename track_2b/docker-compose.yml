services:
  app:
    build: .
    image: inbrev:latest
    ports:
      - "127.0.0.1:${INBREV_PORT:-8000}:8000"
    environment:
      LLM_NAME: ${LLM_NAME:-apertus-v1.5-8b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
      LLM_API_KEY: ${LLM_API_KEY:-none}
      INBREV_SAMPLES: ${INBREV_SAMPLES:-3}
      INBREV_PRECOMPUTED: ${INBREV_PRECOMPUTED:-}
      INBREV_AUDIT_LOG: /app/runs/audit.jsonl
    volumes:
      - runs:/app/runs
    networks:
      - practice
      - default

  llm:
    profiles: ["local"]
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      [
        "-m",
        "/models/${GGUF_FILE:-apertus-v1.5-8b-text-Q4_K_M.gguf}",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "-c",
        "8192",
        "--parallel",
        "2",
        "--jinja",
      ]
    volumes:
      - ./models:/models:ro
    networks:
      - practice

networks:
  practice:
    internal: true

volumes:
  runs:
