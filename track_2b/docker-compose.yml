services:
  app:
    build: .
    image: inbrev:latest
    ports:
      - "127.0.0.1:${INBREV_PORT:-8000}:8000"
    environment:
      LLM_NAME: ${LLM_NAME:-apertus-v1.5-8b}
      # Empty = no endpoint: the app shows stored results and explains what to set.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-none}
      INBREV_SAMPLES: ${INBREV_SAMPLES:-3}
      # Optional, off by default: e.g. apertus-v1.5-70b on the same endpoint (see docs/RUNNING.md).
      INBREV_SECOND_OPINION_MODEL: ${INBREV_SECOND_OPINION_MODEL:-}
      # Stored seed results so "Load" works without endpoint credentials; "Sort inbox" calls the model.
      INBREV_PRECOMPUTED: ${INBREV_PRECOMPUTED:-/app/data/demo/seed-predictions.jsonl}
      INBREV_AUDIT_LOG: /app/runs/audit.jsonl
    volumes:
      - runs:/app/runs
    networks:
      - default

  llm:
    profiles: ["local"]
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:559ac229adefe0f7e2d4e32f5222f26927b6bb8ba44b9db08e2544afebf41984
    command:
      [
        "-m",
        "/models/${GGUF_FILE:-apertus-v1.5-8b-text-Q4_K_M.gguf}",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "-c",
        "8192",
        "--parallel",
        "1",
        "--jinja",
        "--load-mode",
        "none",
      ]
    volumes:
      - ${MODELS_SRC:-./models}:/models:ro
    networks:
      - practice

  app-local:
    profiles: ["local"]
    image: inbrev:latest
    depends_on:
      - llm
    environment:
      LLM_NAME: ${LOCAL_LLM_NAME:-apertus-v1.5-8b-q4_k_m}
      LLM_BASE_URL: http://llm:8080/v1
      LLM_API_KEY: none
      INBREV_SAMPLES: ${LOCAL_INBREV_SAMPLES:-1}
      INBREV_SPLIT_SAMPLES: "on"
      INBREV_CONCURRENCY: "1"
      INBREV_TIMEOUT: "1800"
      INBREV_PRECOMPUTED: ${INBREV_PRECOMPUTED:-}
      INBREV_AUDIT_LOG: /app/runs/audit.jsonl
    volumes:
      - runs:/app/runs
    networks:
      - practice

  gateway:
    profiles: ["local"]
    image: nginx:1.27-alpine
    depends_on:
      - app-local
    ports:
      - "127.0.0.1:${INBREV_PORT:-8000}:8080"
    volumes:
      - ./deploy/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - practice
      - default

networks:
  practice:
    internal: true

volumes:
  runs:
  models:
    name: inbrev-models
