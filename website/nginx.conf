map $uri $cache_control {
    ~^/assets/         "public, max-age=604800";
    ~^/pitch/png/      "public, max-age=86400";
    ~^/pitch/og\.png$  "public, max-age=86400";
    ~^/media/          "public, max-age=86400";
    default            "no-cache";
}

# CSP only for HTML: the logo SVGs carry their own <style> for the animation.
# The pitch deck is one self-contained file with inline style and script and Google Fonts.
map "$sent_http_content_type|$uri" $csp {
    "~^text/html[^|]*\|/pitch/"  "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; media-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'";
    "~^text/html"                "default-src 'self'; script-src 'self'; connect-src 'self' https://kontakt.apertool.ch; img-src 'self' data:; style-src 'self'; font-src 'self'; media-src 'self'; frame-src https://www.youtube-nocookie.com; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'";
    default                      "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/auth.conf;

    server_tokens off;
    absolute_redirect off;
    access_log off;
    log_not_found off;

    charset utf-8;
    charset_types text/css application/javascript image/svg+xml text/plain text/vtt;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json application/pdf;

    if ($request_uri ~ "^(?<dir>[^?]*/)index\.html(?<qs>\?.*)?$") {
        return 301 $dir$qs;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /media/ {
        types { video/mp4 mp4; text/vtt vtt; image/jpeg jpg; }
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
